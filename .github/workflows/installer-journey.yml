name: Installer journey gate

on:
  pull_request:
    paths:
      - 'tools/kb-create/**'
      - 'tools/kb-create/install.sh'
      - 'core/**'
      - 'sdk/**'
      - 'shared/**'
      - 'cli/**'
      - 'services/**'
      - 'adapters/**'
      - 'plugins/**'
      - 'tools/kb-create/scripts/**'
      - 'e2e/platform/**'
      - 'e2e/journey/**'
      - 'e2e/scripts/pack-all.sh'
      - '.github/workflows/reusable-installer-journey.yml'
      - '.github/workflows/installer-journey.yml'
  push:
    branches: [master]
    paths:
      - 'tools/kb-create/**'
      - 'tools/kb-create/install.sh'
      - 'core/**'
      - 'sdk/**'
      - 'shared/**'
      - 'cli/**'
      - 'services/**'
      - 'adapters/**'
      - 'plugins/**'
      - 'tools/kb-create/scripts/**'
      - 'e2e/platform/**'
      - 'e2e/journey/**'
      - 'e2e/scripts/pack-all.sh'
      - '.github/workflows/reusable-installer-journey.yml'
      - '.github/workflows/installer-journey.yml'

permissions:
  contents: read

jobs:
  journey:
    uses: ./.github/workflows/reusable-installer-journey.yml
    permissions:
      contents: read

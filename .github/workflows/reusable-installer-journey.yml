name: Reusable — clean installer journey

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit used to build the release candidate
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    name: Build local release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      journeys: ${{ steps.matrix.outputs.journeys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-create/go.sum
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build affected workspace packages
        run: kb-devkit run build --affected
      - name: Restore packed package cache
        id: tgz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e/packages/
          key: journey-tgz-v1-${{ runner.os }}-${{ hashFiles('**/dist/**/*.js', '**/dist/**/*.d.ts', '**/package.json') }}
      - name: Pack artifacts and seal the candidate release index
        env:
          KB_JOURNEY_PACKAGES_READY: ${{ steps.tgz-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: e2e/journey/prepare-candidate.sh
      - id: matrix
        name: Derive journey matrix from built-in scenarios
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'tools/kb-create/v2/scenario/scenarios';
          const journeys = fs.readdirSync(dir)
            .filter(name => name.endsWith('.json') && name !== 'custom.json')
            .map(name => `agent:${path.basename(name, '.json')}`);
          journeys.push('human:default', 'human:nondefault', 'negative:wrong-node',
            'negative:occupied-port', 'negative:relative-path');
          process.stdout.write(`journeys=${JSON.stringify(journeys)}\n`);
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-journey-candidate
          path: |
            e2e/packages/*.tgz
            .journey/release/**
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  journey:
    name: Journey ${{ matrix.case }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.prepare.outputs.journeys) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: installer-journey-candidate
      - name: Restore Verdaccio storage cache
        id: verdaccio-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e/.verdaccio-storage
          key: journey-verdaccio-${{ runner.os }}-${{ hashFiles('e2e/packages/*.tgz') }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Restore Docker build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache-journey
          key: journey-buildx-${{ runner.os }}-${{ hashFiles('e2e/journey/**', 'e2e/publisher/**', 'e2e/packages/*.tgz') }}
          restore-keys: journey-buildx-${{ runner.os }}-
      - name: Run journey in a fresh container
        env:
          KB_JOURNEY_CI: '1'
          KB_JOURNEY_ONLY: ${{ matrix.case }}
        run: e2e/journey/run.sh --no-build
      - name: Stop journey containers
        if: always()
        run: docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.ci.yml -f e2e/journey/docker-compose.yml down --volumes --remove-orphans || true
      - name: Add journey report to job summary
        if: always()
        run: if [ -f .journey/reports/journey-summary.md ]; then cat .journey/reports/journey-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
